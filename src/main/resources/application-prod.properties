spring.application.name=SmartReview
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

smartreview.repo.clone-base-dir=/tmp/smartreview-repos
smartreview.repo.max-file-size-kb=100
smartreview.repo.max-cache-size-gb=5
smartreview.repo.supported-extensions=.java,.py,.ts,.js,.go,.cs,.cpp,.c,.rb,.php

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-haiku-4-5

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s
gemini.model=gemini-1.5-flash